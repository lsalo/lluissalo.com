<script>
function fixFooter() {
  var f = document.getElementById('custom-footer');
  if (!f) return;
  f.style.marginLeft = '0px';
  f.style.width = '100%';
  void f.offsetWidth;
  var rect = f.getBoundingClientRect();
  f.style.width = window.innerWidth + 'px';
  f.style.marginLeft = (-rect.left) + 'px';
}

function stickyFooter() {
  var f = document.getElementById('custom-footer');
  if (!f) return;
  f.style.marginTop = '0px';
  f.style.marginBottom = '0px';
  void f.offsetWidth;
  
  var footerRect = f.getBoundingClientRect();
  var footerBottom = footerRect.bottom;
  var windowHeight = window.innerHeight;
  
  if (footerBottom < windowHeight) {
    var gap = windowHeight - footerBottom;
    f.style.marginTop = gap + 'px';
  }
  
  void f.offsetWidth;
  footerRect = f.getBoundingClientRect();
  if (footerRect.bottom < windowHeight) {
    f.style.paddingBottom = (windowHeight - footerRect.bottom) + 'px';
  } else {
    f.style.paddingBottom = '0px';
  }
}

fixFooter();
stickyFooter();

window.addEventListener('load', function() {
  fixFooter();
  stickyFooter();
});

setTimeout(function() {
  fixFooter();
  stickyFooter();
}, 500);

var resizeTimer;
window.addEventListener('resize', function() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function() {
    fixFooter();
    stickyFooter();
  }, 50);
});

if (window.ResizeObserver) {
  new ResizeObserver(function() {
    fixFooter();
    stickyFooter();
  }).observe(document.body);
}
</script>
